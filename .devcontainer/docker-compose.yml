# Nur für GitHub Codespaces / Dev Containers. Die DB ist nur innerhalb des Codespaces erreichbar.
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # App und DB teilen sich das Netzwerk → Postgres unter localhost:5432
    network_mode: service:db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: schnapperradar
      POSTGRES_USER: schnapper
      POSTGRES_PASSWORD: codespace-only

volumes:
  postgres-data:
